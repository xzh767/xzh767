name: Download Daily Wallpaper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Bing daily wallpaper
        run: |
          cd assets
          base=$(curl -sf "https://cn.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1" | jq -r '.images[0].urlbase')
          echo "Bing urlbase: ${base}"
          curl -sfL "https://cn.bing.com${base}_UHD.jpg" -o bing_wallpaper_4k.jpg
          curl -sfL "https://cn.bing.com${base}_1920x1080.jpg" -o bing_wallpaper_1080p.jpg

      - name: Download random wallpapers
        run: |
          cd assets
          curl -sfL "https://picsum.photos/4096/2160" -o unsplash_wallpaper_4k.jpg
          curl -sfL "https://picsum.photos/1920/1080" -o unsplash_wallpaper_1080p.jpg

      - name: Validate downloads
        run: |
          cd assets
          for f in bing_wallpaper_4k.jpg bing_wallpaper_1080p.jpg unsplash_wallpaper_4k.jpg unsplash_wallpaper_1080p.jpg; do
            if [ ! -s "$f" ]; then echo "::error::$f is empty"; exit 1; fi
            echo "$f: $(stat -c%s "$f") bytes"
          done

      - name: Commit wallpapers
        uses: EndBug/add-and-commit@v9
        with:
          add: "assets/*.jpg"
          message: 'chore: update daily wallpapers'
          default_author: github_actions
