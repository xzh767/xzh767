name: Update Profile Cards

on:
  push:
    paths-ignore:
      - "profile/*.svg"
      - "assets/github-contribution-grid-snake.svg"
      - "assets/github-contribution-grid-snake.gif"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ./assets/github-contribution-grid-snake.svg
            ./assets/github-contribution-grid-snake.gif

      - name: Commit generated cards
        uses: EndBug/add-and-commit@v9
        with:
          add: "profile/*.svg assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake.gif"
          message: "chore: update profile cards"
          default_author: github_actions
